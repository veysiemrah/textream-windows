[package]
name = "textream"
description = "Teleprompter for Windows with word tracking, auto-scroll and voice-activated scrolling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# Tauri wants a cdylib for mobile targets and a staticlib-free rlib for the
# desktop binary to link against.
name = "textream_lib"
crate-type = ["lib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Pin the upstream sherpa-rs commit that skips cargs.lib on Windows. The 0.6.8
# crates.io build script incorrectly links the CLI-only cargs library when using
# the current prebuilt sherpa-onnx package, which no longer ships that import
# library. Keeping the exact revision makes the dependency reproducible.
sherpa-rs-sys = { git = "https://github.com/thewh1teagle/sherpa-rs", rev = "857bedd35ec5215c65b4911fdadca31f403b6f6b", package = "sherpa-rs-sys", default-features = false, features = ["download-binaries"] }

[dependencies]
prompt-core.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Microphone capture. WASAPI on Windows, no native build step.
cpal = "0.18"
# Streaming speech recognition. `tts` is off — this app never synthesises —
# and `sys` exposes the online C API, which the safe wrapper does not cover.
# This is pinned to the same upstream revision as sherpa-rs-sys so Cargo uses
# one matching FFI implementation and gets the Windows cargs linker fix.
sherpa-rs = { git = "https://github.com/thewh1teagle/sherpa-rs", rev = "857bedd35ec5215c65b4911fdadca31f403b6f6b", package = "sherpa-rs", default-features = false, features = [
  "download-binaries",
  "sys",
] }
# Model downloads. Small, blocking, and already in the dependency graph.
ureq = "2"
# Verifies a downloaded model's bytes against its pinned checksum before it
# ever reaches the ONNX runtime.
sha2 = "0.10"

# DWM backdrop effects for the frameless main window.
window-vibrancy = "0.8"

windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }

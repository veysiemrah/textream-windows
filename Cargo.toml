[workspace]
members = ["crates/prompt-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["CRTkafa"]

[workspace.dependencies]
unicode-segmentation = "1.12"
prompt-core = { path = "crates/prompt-core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
